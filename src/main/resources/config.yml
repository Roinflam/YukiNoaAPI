# ========================================
# Configuration file version - DO NOT MODIFY!
# Config files will only be overwritten when the MAJOR version number (first digit) changes
# ----------------------------------------
# 配置文件版本号 - 请勿修改！
# 只有当主版本号（第一个数字）发生变化时，插件才会自动覆盖所有配置文件
# ========================================
ConfigVersion: '3.3.0'

# ========================================
# Language Settings
# 语言设置
# ========================================

# Available options:
#   default  - Auto-detect system language (recommended)
#   zh_cn    - Simplified Chinese (简体中文)
#   en_us    - English
# ----------------------------------------
# 可选值:
#   default  - 自动检测系统语言（推荐）
#   zh_cn    - 简体中文
#   en_us    - English
Language: default

# ========================================
# Logging Settings
# 日志设置
# ========================================
Logging:
  # Enable debug mode
  # Shows detailed logs for NMS reflection, config operations, etc.
  # Recommended only for troubleshooting
  # ----------------------------------------
  # 启用调试模式
  # 显示 NMS 反射、配置操作等详细日志
  # 建议仅在故障排查时开启
  Debug: false

  # Print full exception stack traces
  # When disabled, only shows brief error messages
  # ----------------------------------------
  # 打印完整异常堆栈
  # 关闭时仅显示简要错误信息
  PrintStackTrace: true

# ========================================
# Item Serialization
# 物品序列化
# ========================================

# Use ProtocolLib for item serialization
# Fixes issues with special characters and 1.7 compatibility
# WARNING: Changing this requires reconfiguring all plugins using item serialization!
# ----------------------------------------
# 使用 ProtocolLib 进行物品序列化
# 修复特殊字符问题和 1.7 版本兼容性
# 警告：修改此项需要重新配置所有使用物品序列化的插件！
ProtocolLibItem: true

# ========================================
# Data Directory
# 数据目录
# ========================================

# Custom data directory for plugins depending on this API
# If empty, plugins use default plugins/PluginName directory
# If set, plugins use SpecifiedPath/PluginName as data directory
#
# Examples:
#   'D:\ServerData' -> D:\ServerData\PluginName
#   '/home/minecraft/data' -> /home/minecraft/data/PluginName
#
# Note: Does not apply to YukiNoaAPI itself
# ----------------------------------------
# 依赖此 API 的插件的自定义数据目录
# 留空则使用默认的 plugins/插件名 目录
# 设置后使用 指定路径/插件名 作为数据目录
#
# 示例：
#   'D:\ServerData' -> D:\ServerData\插件名
#   '/home/minecraft/data' -> /home/minecraft/data/插件名
#
# 注意：不适用于 YukiNoaAPI 本身
CustomDataDirectory: ''

# ========================================
# Database Settings
# 数据库设置
# ========================================
Database:
  MySQL:
    # MySQL connection parameters
    # If empty, defaults to: useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    #
    # Common parameters:
    #   useSSL=false - Disable SSL (recommended for local databases)
    #   autoReconnect=true - Auto reconnect on connection loss
    #   characterEncoding=UTF-8 - Character encoding
    #   serverTimezone=UTC - Server timezone
    #   allowPublicKeyRetrieval=true - Allow public key retrieval (MySQL 8.0+)
    # ----------------------------------------
    # MySQL 连接参数
    # 留空则使用默认：useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    #
    # 常用参数：
    #   useSSL=false - 禁用 SSL（本地数据库建议）
    #   autoReconnect=true - 自动重连
    #   characterEncoding=UTF-8 - 字符编码
    #   serverTimezone=UTC - 服务器时区
    #   allowPublicKeyRetrieval=true - 允许公钥检索（MySQL 8.0+）
    Parameters: ''

# ========================================
# Skull Settings
# 头颅设置
# ========================================
Skull:
  # Preload player skulls on join
  # Prevents main thread lag when getting player skulls
  # Recommended for servers using player skulls frequently
  # ----------------------------------------
  # 玩家进服时预加载头颅
  # 防止获取头颅时主线程卡顿
  # 推荐频繁使用玩家头颅的服务器开启
  Preload: false

  # Clear skull cache when player quits
  # Enabled: Saves memory, requires reload on next join
  # Disabled: Keeps cache, better for frequent joins/quits
  # ----------------------------------------
  # 玩家退出时清除头颅缓存
  # 启用：节省内存，下次进服需重新加载
  # 禁用：保留缓存，适合频繁进出的服务器
  ClearOnQuit: false

  # Delay before preloading skull (ticks, 20 ticks = 1 second)
  # Helps avoid server stress during player login
  # ----------------------------------------
  # 预加载头颅前的延迟（tick，20 tick = 1 秒）
  # 避免玩家登录时服务器压力过大
  PreloadDelay: 20
