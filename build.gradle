// ==================== 插件配置 ====================
// Java插件：让Gradle知道这是一个Java项目
plugins {
    id 'java'
}

// ==================== 项目基本信息 ====================
// 组ID：通常是你的域名倒写，比如 pers.tany
group = 'pers.tany'

// 版本号：修改这里会自动同步到 plugin.yml
version = '3.0.0'

// ==================== 依赖仓库 ====================
// Gradle会从这些地方下载你需要的依赖库
repositories {
    // Maven中央仓库：最大的Java库仓库
    mavenCentral()

    // SpigotMC仓库：Bukkit/Spigot API
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }

    // Sonatype仓库：一些开源项目的快照版本
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    // 本地libs文件夹：放你手动下载的jar包
    flatDir {
        dirs 'libs'
    }
}

// ==================== 项目依赖 ====================
// 你的项目需要用到的外部库
dependencies {
    // HikariCP：高性能数据库连接池
    implementation 'com.zaxxer:HikariCP:4.0.3'

    // 本地JAR：libs文件夹里的所有jar包（比如Spigot、NBTAPI、Vault等）
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// ==================== Java版本配置 ====================
// 目标Java版本：8 表示兼容Java 8及以上
def targetJavaVersion = 8

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    // 源代码兼容性：你写的代码要符合Java 8语法
    sourceCompatibility = javaVersion
    // 编译目标：编译出来的class文件能在Java 8上运行
    targetCompatibility = javaVersion

    // 如果你的JDK版本比目标版本低，自动下载对应版本的JDK
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

// ==================== 编译配置 ====================
tasks.withType(JavaCompile).configureEach {
    // 源代码编码：防止中文乱码
    options.encoding = 'UTF-8'

    // Java 10+ 需要指定 release 版本
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// ==================== Javadoc配置 ====================
// 生成API文档的配置
javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    // 文档标题
    options.windowTitle = "YukiNoaAPI ${version} API"
    options.docTitle = "YukiNoaAPI ${version} API Documentation"
    // 不显示警告（注释不完整时不会报错）
    options.addStringOption('Xdoclint:none', '-quiet')
    // 支持中文
    options.addStringOption('encoding', 'UTF-8')

    // 忽略错误继续生成（有些类可能引用了外部库）
    failOnError = false
}

// ==================== 资源处理 ====================
processResources {
    // 定义要替换的变量
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'

    // 在 plugin.yml 中把 ${version} 替换成实际版本号
    filesMatching('plugin.yml') {
        expand props
    }
}

// ==================== 版本同步任务 ====================
// 自动把版本号写入 plugin.yml（双保险）
task updatePluginVersion {
    doLast {
        def pluginYml = file('src/main/resources/plugin.yml')
        if (pluginYml.exists()) {
            def content = pluginYml.text
            // 用正则替换版本号那一行
            content = content.replaceAll(/version:\s*['"]?.*['"]?/, "version: '${version}'")
            pluginYml.text = content
            println "✓ 已同步版本号到 plugin.yml: ${version}"
        }
    }
}

// 确保在处理资源之前先更新版本号
processResources.dependsOn updatePluginVersion

// ==================== JAR打包配置 ====================
jar {
    // 重复文件处理：如果有重复的文件，保留第一个
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 1. 包含编译后的class文件
    from sourceSets.main.output

    // 2. 包含Javadoc文档（打包进 docs 目录）
    from(javadoc.destinationDir) {
        into 'docs'
    }

    // 3. 包含依赖库（排除libs目录的jar，因为那些是服务端已有的）
    from {
        configurations.runtimeClasspath
                .findAll { file ->
                    // 排除libs目录里的jar（Spigot、NBTAPI这些服务端已经有了）
                    !file.path.startsWith(project.file('libs').absolutePath)
                }
                .collect { file ->
                    // 如果是jar就解压，如果是目录就直接包含
                    file.isDirectory() ? file : zipTree(file)
                }
    }

    // 打包完成后的提示
    doLast {
        println ""
        println "==================== 打包完成 ===================="
        println "✓ JAR文件: ${archiveFile.get().asFile.absolutePath}"
        println "✓ 包含内容: 编译代码 + HikariCP + Javadoc文档"
        println "✓ 排除内容: libs目录的JAR（服务端已有）"
        println "=================================================="
    }
}

// JAR打包前先生成Javadoc
jar.dependsOn javadoc

// ==================== 额外的JAR任务（可选） ====================
// 源代码JAR：方便别人查看你的源码
tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource

    doLast {
        println "✓ 源代码JAR已生成: ${archiveFile.get().asFile.name}"
    }
}

// 纯Javadoc JAR：单独的文档包
tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir

    doLast {
        println "✓ Javadoc JAR已生成: ${archiveFile.get().asFile.name}"
    }
}

// ==================== 构建产物 ====================
artifacts {
    archives sourcesJar
    archives javadocJar
}

// ==================== 便捷任务 ====================
// 一键打包所有：主JAR + 源码JAR + 文档JAR
task buildAll {
    dependsOn jar, sourcesJar, javadocJar

    doLast {
        println ""
        println "==================== 全部打包完成 ===================="
        println "生成的文件在 build/libs/ 目录下："
        println "  - YukiNoaAPI-${version}.jar         (主插件，含文档)"
        println "  - YukiNoaAPI-${version}-sources.jar (源代码)"
        println "  - YukiNoaAPI-${version}-javadoc.jar (API文档)"
        println "====================================================="
    }
}