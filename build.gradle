// 应用Java插件，这是开发Java项目所必需的
plugins {
    id 'java'
}

// 设置项目的组ID，通常是你的包名
group = 'pers.tany'

// 设置项目版本
version = '3.0.0'

// 配置项目的依赖仓库
repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    flatDir {
        dirs 'libs'
    }
}

// 项目依赖配置
dependencies {
    implementation 'com.zaxxer:HikariCP:4.0.3'

    // 添加本地JAR文件依赖（示例）
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// 设置目标Java版本
def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

// 配置Java编译任务
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// 配置资源处理任务
processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }

    doLast {
        println "资源处理完成"
    }
}

// 添加一个新任务来直接更新plugin.yml中的版本
task updatePluginVersion {
    doLast {
        def pluginYml = file('src/main/resources/plugin.yml')
        def lines = pluginYml.readLines()
        def writer = new PrintWriter(pluginYml)
        lines.each { line ->
            if (line.startsWith("version:")) {
                writer.println("version: '${version}'")
            } else {
                writer.println(line)
            }
        }
        writer.close()
        println "已更新plugin.yml中的版本为 ${version}"
    }
}

// 确保在处理资源之前更新plugin.yml
processResources.dependsOn updatePluginVersion

// 配置JAR任务
jar {
    // 设置重复策略为EXCLUDE，这将防止重复文件被添加到JAR中
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 包含编译后的主类
    from sourceSets.main.output

    // 明确指定要包含的依赖
    from {
        configurations.runtimeClasspath
                .findAll { !it.name.endsWith('jar') || !it.path.startsWith(project.file('libs').path) }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }

    doLast {
        println "JAR文件已创建，包含所有依赖（除了libs目录中的JAR文件）"
    }
}

// 添加源代码JAR任务
tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

// 添加Javadoc JAR任务
tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

// 将源代码和Javadoc JAR添加到构建产物中
artifacts {
    archives javadocJar
}